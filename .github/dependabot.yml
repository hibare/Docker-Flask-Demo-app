# Managed by Axon; manual edits will be overwritten.
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain version for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      docker:
        patterns:
          - "*"

  # Maintain dependencies for Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      python:
        patterns:
          - "*"

  # Maintain dependencies for pre-commit
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      pre-commit:
        patterns:
          - "*"

  # Maintain dependencies for Bundler (Ruby)
  - package-ecosystem: "bundler"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      bundler:
        patterns:
          - "*"
